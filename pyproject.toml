[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firm-rp-garp"
version = "0.1.0"
description = "GARP/CCEI/MPI revealed-preference diagnostics on Norwegian AS firm data"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "google-cloud-storage>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src"]
